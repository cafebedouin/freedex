# One grouped pull request a month for every npm dependency, so Dependabot costs at most one pull request's CI
# (the pages build, the browser job and the CodeQL run) a month. Security updates are not enabled separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-npm:
        patterns: ["*"]
    # @nautls/machinafi-sdk 0.1.0 declares peer typescript ^5, so npm ci refuses a TypeScript major bump (pull
    # request #2, typescript 7.0.2: ERESOLVE). Drop this once the SDK accepts the new major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
